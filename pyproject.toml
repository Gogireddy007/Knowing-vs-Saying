[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dissociation-test"
version = "0.1.0"
description = "Diagnostic tool for separating world-model failures from deployment failures in LLM agents"
authors = [{name = "Anonymous"}]
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["cart_state*", "probing*", "evaluation*", "analysis*", "minigrid_val*", "interventions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
